<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Connect to WiFi internet" />
    <title>WiFi Portal</title>
    <style>
      /* Critical first paint — pure CSS shell shown before JS loads */
      html, body { margin: 0; padding: 0; background: #f5f5f7; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .boot {
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      }
      .boot-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #0071e3; margin: 0 4px;
        animation: boot-pulse 1s infinite ease-in-out;
      }
      .boot-dot:nth-child(2) { animation-delay: 0.15s; }
      .boot-dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-pulse { 0%,100% { opacity: .3; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }
      @media (prefers-reduced-motion: reduce) { .boot-dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="Loading">
        <div class="boot-dot"></div><div class="boot-dot"></div><div class="boot-dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
