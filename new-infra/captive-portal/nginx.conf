# Captive portal static server + same-origin API/socket proxy.
# Serving /api and /socket.io on the portal origin keeps the walled-garden
# allow-list minimal (portal host + payment provider hosts only).

# NOTE: use the unique container_name — bare service names like "backend"
# can collide with other projects on the shared Dokploy network.
server {
    listen 80;
    server_name _;

    # Re-resolve the backend through Docker's DNS on every request so a
    # backend redeploy (new container IP) never leaves this proxy on a stale
    # address. A variable in proxy_pass is what forces runtime resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://triva-backend:4000;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security headers (captive portal still benefits from sane defaults)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build assets — long cache
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy → backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Socket.IO proxy → backend (websocket upgrade)
    location /socket.io/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all portal paths serve the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
