server triva {
    listen {
        type = auth
        ipaddr = *
        port = 1812
    }
    listen {
        type = acct
        ipaddr = *
        port = 1813
    }
    authorize {
        if (!User-Name || !User-Password) {
            reject
        }
        if (User-Name !~ /^triva_[0-9a-f]{16}$/) {
            reject
        }
        triva_sql
        if (notfound || fail) {
            reject
        }
        pap
    }
    authenticate {
        Auth-Type PAP {
            pap
        }
    }
    accounting {
        detail
    }
}
