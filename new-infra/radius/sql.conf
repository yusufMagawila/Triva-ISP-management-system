sql triva_sql {
    dialect = "postgresql"
    driver = "rlm_sql_postgresql"
    postgresql {
        send_application_name = yes
    }
    server = @@DB_HOST@@
    port = 5432
    login = @@DB_USER@@
    password = @@DB_PASSWORD@@
    radius_db = @@DB_NAME@@
    read_groups = no
    read_profiles = no
    read_clients = yes
    client_table = "nas"
    client_query = "SELECT id, nasname, shortname, type, secret, server FROM nas WHERE nasname <> '%' AND nasname <> '0.0.0.0/0' AND nasname <> '::/0'"
    sql_user_name = "%{User-Name}"
    authorize_check_query = "SELECT 1, r.username, 'Cleartext-Password', r.password, ':=' FROM radius_users r JOIN sessions s ON s.id = r.session_id AND s.\"tenantId\" = r.tenant_id JOIN omada_sites o ON o.id = s.\"omadaSiteId\" AND o.\"tenantId\" = r.tenant_id JOIN tenants t ON t.id = r.tenant_id WHERE r.username = '%{SQL-User-Name}' AND r.status = 'ACTIVE' AND s.status = 'ACTIVE' AND t.status = 'ACTIVE' AND r.expires_at > NOW() AND s.\"expiresAt\" > NOW() AND o.\"controllerIp\" = '%{Packet-Src-IP-Address}'"
    authorize_reply_query = "SELECT 1, r.username, 'Session-Timeout', GREATEST(1, FLOOR(EXTRACT(EPOCH FROM (LEAST(r.expires_at, s.\"expiresAt\") - NOW()))))::text, ':=' FROM radius_users r JOIN sessions s ON s.id = r.session_id AND s.\"tenantId\" = r.tenant_id JOIN omada_sites o ON o.id = s.\"omadaSiteId\" AND o.\"tenantId\" = r.tenant_id WHERE r.username = '%{SQL-User-Name}' AND r.status = 'ACTIVE' AND s.status = 'ACTIVE' AND r.expires_at > NOW() AND s.\"expiresAt\" > NOW() AND o.\"controllerIp\" = '%{Packet-Src-IP-Address}'"
    pool {
        start = 1
        min = 1
        max = 8
        spare = 1
        uses = 0
        lifetime = 0
        idle_timeout = 60
        retry_delay = 5
    }
}
